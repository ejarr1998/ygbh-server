app = 'ygbh-server'
primary_region = 'iad'

[build]

[[services]]
  internal_port = 8787
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ["tcp"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "tcp"]

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
